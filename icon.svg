<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Flag Stripe Clip Path (rounded squircle inside speech bubble) -->
    <clipPath id="bubbleClip">
      <path d="M 128 100 C 128 78, 146 60, 168 60 L 344 60 C 366 60, 384 78, 384 100 L 384 270 C 384 292, 366 310, 344 310 L 220 310 L 160 360 L 175 310 L 168 310 C 146 310, 128 292, 128 270 Z"/>
    </clipPath>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Base App Icon Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Circular Glow -->
  <circle cx="256" cy="230" r="170" fill="#2563eb" opacity="0.12"/>

  <!-- Serbian Flag Speech Bubble with drop shadow -->
  <g filter="url(#dropShadow)">
    <!-- Red Top Stripe -->
    <rect x="110" y="50" width="290" height="92" fill="#c6363c" clip-path="url(#bubbleClip)"/>
    <!-- Blue Middle Stripe -->
    <rect x="110" y="142" width="290" height="88" fill="#0c4076" clip-path="url(#bubbleClip)"/>
    <!-- White Bottom Stripe -->
    <rect x="110" y="230" width="290" height="140" fill="#f8fafc" clip-path="url(#bubbleClip)"/>

    <!-- Bubble Crisp Border Stroke -->
    <path d="M 128 100 C 128 78, 146 60, 168 60 L 344 60 C 366 60, 384 78, 384 100 L 384 270 C 384 292, 366 310, 344 310 L 220 310 L 160 360 L 175 310 L 168 310 C 146 310, 128 292, 128 270 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Stylized Monogram "SL" (SerboLingo) Inside Bubble -->
  <text x="256" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="108" fill="#ffffff" text-anchor="middle" dominant-baseline="central" style="letter-spacing: -2px; text-shadow: 0 4px 12px rgba(0,0,0,0.5);">SL</text>

  <!-- Golden XP Lightning Bolt badge in bottom right -->
  <g transform="translate(320, 310) scale(1.15)" filter="url(#dropShadow)">
    <circle cx="40" cy="40" r="44" fill="#1e293b" stroke="#eab308" stroke-width="4"/>
    <!-- Lightning Bolt Shape -->
    <path d="M 44 14 L 20 44 L 38 44 L 32 68 L 60 36 L 42 36 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- App Title Text Below Bubble -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#f1f5f9" text-anchor="middle" letter-spacing="3">SERBOLINGO</text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#60a5fa" text-anchor="middle" letter-spacing="2">SRBIJA ↔ WORLD</text>
</svg>