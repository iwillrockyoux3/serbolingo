<script>
const DB_NAME = 'SerboLingoDB';
const DB_VERSION = 5;

const db = {
    _db: null,

    async init() {
        return new Promise((resolve, reject) => {
            // Global timeout for the entire IndexedDB init sequence to prevent silent hangs on file:///
            const timeoutId = setTimeout(() => {
                console.warn("IndexedDB init timed out (likely a file:/// transaction hang). Using fallback.");
                resolve(); // Resolve to let app.js continue
            }, 1000); // 1 second is plenty for local DB init

            try {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (database.objectStoreNames.contains('dictionary')) {
                        database.deleteObjectStore('dictionary');
                    }
                    const store = database.createObjectStore('dictionary', { keyPath: 'id' });
                    store.createIndex('category', 'category', { unique: false });
                };

                request.onsuccess = async (event) => {
                    this._db = event.target.result;
                    try {
                        const count = await this.countWords();
                        if (count === 0) {
                            await this.seedDatabase();
                        }
                    } catch (seedErr) {
                        console.warn("DB seeding skipped:", seedErr);
                    }
                    clearTimeout(timeoutId); // Only clear when EVERYTHING is fully done
                    resolve();
                };

                request.onerror = (event) => {
                    clearTimeout(timeoutId);
                    console.error("IndexedDB error:", event.target.error);
                    resolve();
                };
                
                request.onblocked = () => {
                    clearTimeout(timeoutId);
                    console.warn("IndexedDB blocked.");
                    resolve();
                };
            } catch (e) {
                clearTimeout(timeoutId);
                console.warn("IndexedDB access error:", e);
                resolve();
            }
        });
    },

    async seedDatabase() {
        try {
            const data = window.SEED_DATA || [];
            
            return new Promise((resolve, reject) => {
                const timeoutId = setTimeout(() => resolve(), 2000);
                try {
                    const transaction = this._db.transaction(['dictionary'], 'readwrite');
                    const store = transaction.objectStore('dictionary');

                    data.forEach(word => {
                        store.put(word);
                    });

                    transaction.oncomplete = () => {
                        clearTimeout(timeoutId);
                        console.log("Database seeded successfully.");
                        resolve();
                    };

                    transaction.onerror = (event) => {
                        clearTimeout(timeoutId);
                        console.error("Error seeding database:", event.target.error);
                        resolve();
                    };
                } catch(e) {
                    clearTimeout(timeoutId);
                    resolve();
                }
            });
        } catch (error) {
            console.error("Failed to fetch seed data:", error);
        }
    },

    countWords() {
        return new Promise((resolve, reject) => {
            const timeoutId = setTimeout(() => resolve(0), 1000);
            try {
                const transaction = this._db.transaction(['dictionary'], 'readonly');
                const store = transaction.objectStore('dictionary');
                const countRequest = store.count();

                countRequest.onsuccess = () => { clearTimeout(timeoutId); resolve(countRequest.result); };
                countRequest.onerror = () => { clearTimeout(timeoutId); resolve(0); };
            } catch (e) {
                clearTimeout(timeoutId);
                resolve(0);
            }
        });
    },

    getAllWords() {
        return new Promise((resolve, reject) => {
            const transaction = this._db.transaction(['dictionary'], 'readonly');
            const store = transaction.objectStore('dictionary');
            const request = store.getAll();

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    },

    getWordsByCategory(category) {
        return new Promise((resolve, reject) => {
            const transaction = this._db.transaction(['dictionary'], 'readonly');
            const store = transaction.objectStore('dictionary');
            const index = store.index('category');
            const request = index.getAll(category);

            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }
};

window.appDb = db;

</script>

<script>
const QuestionEngine = {
    // Utility to shuffle an array
    shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    },

    // Get N random elements from array excluding target
    getRandomDistractors(array, targetId, count) {
        const filtered = array.filter(w => w.id !== targetId);
        const shuffled = this.shuffle(filtered);
        return shuffled.slice(0, count);
    },

    // Generates a single Multiple Choice question object that matches the legacy CURRICULUM format
    generateMultipleChoice(word, allWordsInCategory) {
        const distractors = this.getRandomDistractors(allWordsInCategory, word.id, 2);
        
        // English to Serbian direction (Default)
        const q_enToSr = `Translate: "${word.en}"`;
        const options_enToSr = this.shuffle([
            word.sr_lat,
            distractors[0].sr_lat,
            distractors[1].sr_lat
        ]);
        const correct_enToSr = word.sr_lat;
        
        const guide_enToSr = {};
        distractors.forEach(d => {
            // In EN->SR, the user picks a Serbian word. The guide tells them what it actually means in English.
            guide_enToSr[d.sr_lat] = `❌ "${d.sr_lat}" means "${d.en}".`;
        });

        // Serbian to English direction (Reversed)
        const q_srToEn = `Kako se kaže "${word.sr_lat}"?`;
        const options_srToEn = this.shuffle([
            word.en,
            distractors[0].en,
            distractors[1].en
        ]);
        const correct_srToEn = word.en;
        
        const guide_srToEn = {};
        distractors.forEach(d => {
            // In SR->EN, the user picks an English word. The guide tells them what it actually means in Serbian.
            guide_srToEn[d.en] = `❌ "${d.en}" znači "${d.sr_lat}".`;
        });

        return {
            type: 'multiple_choice',
            q: q_enToSr,
            q_rev: q_srToEn,
            options: options_enToSr,
            options_rev: options_srToEn,
            correct: correct_enToSr,
            correct_rev: correct_srToEn,
            guide: guide_enToSr,
            guide_rev: guide_srToEn,
            explanation: `<div class="flex flex-col gap-1 text-sm mt-1">
                <div>✅ <b>"${word.sr_lat}"</b> means "${word.en}".</div>
                <div>❌ <b>"${distractors[0].sr_lat}"</b> means "${distractors[0].en}".</div>
                <div>❌ <b>"${distractors[1].sr_lat}"</b> means "${distractors[1].en}".</div>
            </div>`,
            explanation_rev: `<div class="flex flex-col gap-1 text-sm mt-1">
                <div>✅ <b>"${word.en}"</b> znači "${word.sr_lat}".</div>
                <div>❌ <b>"${distractors[0].en}"</b> znači "${distractors[0].sr_lat}".</div>
                <div>❌ <b>"${distractors[1].en}"</b> znači "${distractors[1].sr_lat}".</div>
            </div>`
        };
    },

    // Generates a Speaking question
    generateSpeaking(word) {
        return {
            type: 'speaking',
            q: `How do you say this in Serbian?\n"${word.en}"\n(Tap mic to speak)`,
            q_rev: `Kako se ovo kaže na engleskom?\n"${word.sr_lat}"\n(Tap mic to speak)`,
            correct: word.sr_lat,
            correct_rev: word.en,
            // Voice targets
            targetLang: 'sr-RS',
            targetLang_rev: 'en-US'
        };
    },

    // Generates a Picture Choice question (Emoji Choice)
    generatePictureChoice(word, allWords) {
        // Needs 3 distractors with emojis
        let pool = allWords.filter(w => w.id !== word.id && w.emoji);
        let distractors = this.shuffle(pool).slice(0, 3);
        
        // If we don't have enough distractors with emojis, just fallback to standard multiple choice structure
        if (distractors.length < 3) {
            return this.generateMultipleChoice(word, allWords);
        }
        
        let options = this.shuffle([word, ...distractors]);
        
        return {
            type: 'picture_choice',
            q: word.en,
            q_rev: word.sr_lat,
            // The options are objects with text and emoji
            options: options.map(o => ({ text: o.sr_lat, emoji: o.emoji })),
            options_rev: options.map(o => ({ text: o.en, emoji: o.emoji })),
            correct: word.sr_lat,
            correct_rev: word.en,
        };
    },

    // Generates a Listening question (Audio -> Translate/Select)
    generateListening(word, allWords) {
        let pool = allWords.filter(w => w.id !== word.id);
        let distractors = this.shuffle(pool).slice(0, 3);
        
        // For listening, the question IS the audio. We'll store what to speak.
        // We'll also provide options to choose from.
        let options_enToSr = this.shuffle([word.sr_lat, ...distractors.map(d => d.sr_lat)]);
        let options_srToEn = this.shuffle([word.en, ...distractors.map(d => d.en)]);

        return {
            type: 'listening',
            q_audio: word.en, // App will speak this if learning EN->SR
            q_audio_rev: word.sr_lat, // App will speak this if learning SR->EN
            
            // Audio targets for Voice Synthesis
            audioLang: 'en-US',
            audioLang_rev: 'sr-RS',

            options: options_enToSr,
            options_rev: options_srToEn,
            correct: word.sr_lat,
            correct_rev: word.en,
        };
    },

    // Generates a Fill-in-the-blank question object
    generateFillBlank(word) {
        // We need example sentences to do this properly
        if (!word.example_en || !word.example_sr) {
            return null; // Fallback to multiple choice if no sentence exists
        }

        // EN to SR: Show English sentence, show Serbian sentence with target word blanked out
        // E.g., "I have one car" -> "Imam ____ auto", user types "jedan"
        let q_enToSr = `Translate: "${word.example_en}"\n\n${word.example_sr.replace(new RegExp(`\\b${word.sr_lat}\\b`, 'i'), '____')}`;
        let correct_enToSr = word.sr_lat;

        // SR to EN: Show Serbian sentence, show English sentence with target word blanked out
        let q_srToEn = `Prevedi: "${word.example_sr}"\n\n${word.example_en.replace(new RegExp(`\\b${word.en}\\b`, 'i'), '____')}`;
        let correct_srToEn = word.en;

        return {
            type: 'fill_blank',
            q: q_enToSr,
            q_rev: q_srToEn,
            correct: correct_enToSr,
            correct_rev: correct_srToEn,
            explanation: `💡 The missing word was "${correct_enToSr}" (${word.en}).`,
            explanation_rev: `💡 The missing word was "${correct_srToEn}" (${word.sr_lat}).`
        };
    },

    // Generates a Word Order (Scrambled Sentence) question object
    generateWordOrder(word) {
        if (!word.example_en || !word.example_sr) {
            return null;
        }

        // We scramble the target sentence
        const scramble = (sentence) => this.shuffle(sentence.replace(/[.,!?]/g, '').split(' '));

        return {
            type: 'word_order',
            q: `Arrange: "${word.example_en}"`,
            q_rev: `Složi rečenicu: "${word.example_sr}"`,
            scrambled: scramble(word.example_sr),
            scrambled_rev: scramble(word.example_en),
            correct: word.example_sr.replace(/[.,!?]/g, ''),
            correct_rev: word.example_en.replace(/[.,!?]/g, ''),
            explanation: `💡 The correct order is: "${word.example_sr}"`,
            explanation_rev: `💡 The correct order is: "${word.example_en}"`
        };
    },

    // Generates a Hangman question object
    generateHangman(word) {
        return {
            type: 'hangman',
            q: `Spell: "${word.en}"`,
            q_rev: `Napiši: "${word.sr_lat}"`,
            correct: word.sr_lat,
            correct_rev: word.en,
            explanation: `💡 The correct spelling is "${word.sr_lat}".`,
            explanation_rev: `💡 The correct spelling is "${word.en}".`
        };
    },

    // Generates a Matching Pairs question object
    // Takes an array of up to 4 words
    generateMatchingPairs(words) {
        if (!words || words.length < 2) return null;
        
        // Take up to 4 words
        const pairWords = words.slice(0, 4);
        
        const leftCol = this.shuffle(pairWords.map(w => ({ id: w.id, text: w.en, type: 'en', sr_lat: w.sr_lat })));
        const rightCol = this.shuffle(pairWords.map(w => ({ id: w.id, text: w.sr_lat, type: 'sr', en: w.en })));

        return {
            type: 'matching_pairs',
            q: `Match the pairs`,
            q_rev: `Spoj parove`,
            pairs: pairWords.length,
            leftCol,
            rightCol,
            explanation: `💡 Keep practicing to recognize these pairs faster!`,
            explanation_rev: `💡 Vežbaj da brže prepoznaješ parove!`
        };
    },

    // Generates a Dialogue / Story question
    // An AI character sends a message and the user picks the correct reply
    generateDialogue(word, allWords) {
        // Build a mini dialogue scenario based on the word
        const dialogues = {
            'basics': [
                { npc: 'Zdravo! Kako si?', npc_en: 'Hello! How are you?', reply: 'Dobro sam, hvala!', reply_en: 'I\'m fine, thank you!' },
                { npc: 'Dobar dan! Drago mi je.', npc_en: 'Good day! Nice to meet you.', reply: 'I meni je drago!', reply_en: 'Nice to meet you too!' },
                { npc: 'Kako se zoveš?', npc_en: 'What\'s your name?', reply: 'Zovem se Ana.', reply_en: 'My name is Ana.' },
            ],
            'food': [
                { npc: 'Šta želiš za doručak?', npc_en: 'What do you want for breakfast?', reply: 'Želim hleb i kafu.', reply_en: 'I want bread and coffee.' },
                { npc: 'Da li si gladan?', npc_en: 'Are you hungry?', reply: 'Da, veoma sam gladan!', reply_en: 'Yes, I\'m very hungry!' },
                { npc: 'Hoćeš li vode?', npc_en: 'Would you like water?', reply: 'Da, molim te.', reply_en: 'Yes, please.' },
            ],
            'family': [
                { npc: 'Imaš li braću?', npc_en: 'Do you have siblings?', reply: 'Da, imam jednog brata.', reply_en: 'Yes, I have one brother.' },
                { npc: 'Gde živi tvoja majka?', npc_en: 'Where does your mother live?', reply: 'Ona živi u Beogradu.', reply_en: 'She lives in Belgrade.' },
            ],
            'animals': [
                { npc: 'Imaš li kućnog ljubimca?', npc_en: 'Do you have a pet?', reply: 'Da, imam psa.', reply_en: 'Yes, I have a dog.' },
                { npc: 'Koja je tvoja omiljena životinja?', npc_en: 'What is your favorite animal?', reply: 'Volim mačke.', reply_en: 'I love cats.' },
            ],
            'colors': [
                { npc: 'Koja je tvoja omiljena boja?', npc_en: 'What is your favorite color?', reply: 'Volim plavu boju.', reply_en: 'I love the color blue.' },
            ],
        };

        // Try to get a dialogue from this word's category, else fall back to basics
        const category = word.category || 'basics';
        const pool = dialogues[category] || dialogues['basics'];
        const scene = pool[Math.floor(Math.random() * pool.length)];

        // Build wrong replies from other categories
        const allDialogues = Object.values(dialogues).flat();
        const wrongReplies = this.shuffle(allDialogues.filter(d => d.reply !== scene.reply)).slice(0, 2);

        // EN->SR: NPC speaks English, user picks Serbian reply
        const options_enToSr = this.shuffle([scene.reply, ...wrongReplies.map(w => w.reply)]);
        // SR->EN: NPC speaks Serbian, user picks English reply
        const options_srToEn = this.shuffle([scene.reply_en, ...wrongReplies.map(w => w.reply_en)]);

        return {
            type: 'dialogue',
            npcMessage: scene.npc_en,
            npcMessage_rev: scene.npc,
            q: `Reply to the message:`,
            q_rev: `Odgovori na poruku:`,
            options: options_enToSr,
            options_rev: options_srToEn,
            correct: scene.reply,
            correct_rev: scene.reply_en,
        };
    },

    // Generates a set of questions for a category, mixing all types
    async generateLesson(categoryName, dbInstance, count = 10) {
        const allWords = await dbInstance.getWordsByCategory(categoryName);
        if (!allWords || allWords.length < 4) {
            console.error(`Not enough words in category ${categoryName} to generate a full lesson.`);
            return [];
        }

        const selectedWords = this.shuffle(allWords).slice(0, count);
        
        // Sometimes inject a matching pairs question (takes 4 words)
        const injectMatching = Math.random() < 0.4;
        // Sometimes inject a dialogue question
        const injectDialogue = Math.random() < 0.35;
        let matchingIncluded = false;
        
        const lessonQuestions = selectedWords.map((word, index) => {
            if (injectMatching && !matchingIncluded && index >= selectedWords.length - 4) {
                // Ignore the individual word mapping if we are in the last 4 and want matching
                return null;
            }

            const rand = Math.random();
            let q = null;
            
            // If the word has examples, randomly choose sentence game type
            if (word.example_en && word.example_sr) {
                if (rand < 0.15) q = this.generateFillBlank(word);
                else if (rand < 0.30) q = this.generateWordOrder(word);
            }
            
            if (!q) {
                // Distribute across all game types
                if (rand > 0.90) q = this.generateHangman(word);
                else if (rand > 0.78) q = this.generateSpeaking(word);
                else if (rand > 0.65 && word.emoji) q = this.generatePictureChoice(word, allWords);
                else if (rand > 0.50) q = this.generateListening(word, allWords);
                else q = this.generateMultipleChoice(word, allWords);
            }
            
            if (q) q.wordId = word.id;
            return q;
        }).filter(q => q !== null);
        
        // Inject matching pairs
        if (injectMatching) {
            const matchingQ = this.generateMatchingPairs(this.shuffle(allWords));
            if (matchingQ) {
                const insertIndex = Math.floor(Math.random() * lessonQuestions.length);
                lessonQuestions.splice(insertIndex, 0, matchingQ);
            }
        }

        // Inject dialogue
        if (injectDialogue) {
            const dialogueQ = this.generateDialogue(selectedWords[0], allWords);
            if (dialogueQ) {
                dialogueQ.wordId = selectedWords[0].id;
                const insertIndex = Math.floor(Math.random() * lessonQuestions.length);
                lessonQuestions.splice(insertIndex, 0, dialogueQ);
            }
        }
        
        // Trim to exactly 'count' questions if extras were added
        return lessonQuestions.slice(0, count);
    },

    // Phase 4: Smart Practice (Spaced Repetition)
    async generatePracticeLesson(categories, dbInstance, mistakeLog, count = 10) {
        let allWords = [];
        for (const cat of categories) {
            const catWords = await dbInstance.getWordsByCategory(cat);
            if (catWords) allWords = allWords.concat(catWords);
        }

        if (allWords.length === 0) return [];

        // Sort words by mistake count (descending)
        allWords.sort((a, b) => {
            const aMistakes = mistakeLog[a.id] || 0;
            const bMistakes = mistakeLog[b.id] || 0;
            return bMistakes - aMistakes;
        });

        // Take top 6 mistakes (if any) and 4 random words to fill out 10
        const topMistakes = allWords.slice(0, Math.min(6, allWords.length));
        const remaining = this.shuffle(allWords.slice(topMistakes.length));
        
        let selectedWords = topMistakes.concat(remaining).slice(0, count);
        selectedWords = this.shuffle(selectedWords);

        const lessonQuestions = selectedWords.map((word) => {
            const rand = Math.random();
            let q = null;
            
            if (word.example_en && word.example_sr) {
                if (rand < 0.15) q = this.generateFillBlank(word);
                else if (rand < 0.30) q = this.generateWordOrder(word);
            }
            
            if (!q) {
                if (rand > 0.90) q = this.generateHangman(word);
                else if (rand > 0.78) q = this.generateSpeaking(word);
                else if (rand > 0.65 && word.emoji) q = this.generatePictureChoice(word, allWords);
                else if (rand > 0.50) q = this.generateListening(word, allWords);
                else q = this.generateMultipleChoice(word, allWords);
            }
            
            if (q) q.wordId = word.id;
            return q;
        }).filter(q => q !== null);
        
        return lessonQuestions.slice(0, count);
    }
};

window.QuestionEngine = QuestionEngine;

</script>

    2: { bg: 'bg-green-500', text: 'text-white', border: 'border-green-600', shadow: 'shadow-[0_4px_0_rgb(21,128,61)]' },
    3: { bg: 'bg-blue-500', text: 'text-white', border: 'border-blue-600', shadow: 'shadow-[0_4px_0_rgb(29,78,216)]' },
    4: { bg: 'bg-purple-500', text: 'text-white', border: 'border-purple-600', shadow: 'shadow-[0_4px_0_rgb(126,34,206)]' },
    5: { bg: 'bg-yellow-400', text: 'text-yellow-900', border: 'border-yellow-500', shadow: 'shadow-[0_4px_0_rgb(161,98,7)]' },
};

const SkillTreeEngine = {
    _getKey() {
        const username = window.appState && window.appState.user ? window.appState.user.name : 'guest';
        return 'serbolingo_skill_progress_' + username;
    },
    getProgress() {
        const saved = localStorage.getItem(this._getKey());
        if (!saved && localStorage.getItem('serbolingo_skill_progress')) {
            const old = localStorage.getItem('serbolingo_skill_progress');
            localStorage.setItem(this._getKey(), old);
            localStorage.removeItem('serbolingo_skill_progress');
            return JSON.parse(old);
        }
        return saved ? JSON.parse(saved) : {};
    },
    
    saveProgress(progress) {
        localStorage.setItem(this._getKey(), JSON.stringify(progress));
    },
    
    getCrownLevel(skillId) {
        const progress = this.getProgress();
        return (progress[skillId] && progress[skillId].crown) || 0;
    },
    
    getLessonsCompleted(skillId) {
        const progress = this.getProgress();
        return (progress[skillId] && progress[skillId].lessonsInCrown) || 0;
    },
    
    getLessonsPerCrown() {
        return 3;
    },
    
    isUnlocked(skillId) {
        const skill = SKILL_TREE.find(s => s.id === skillId);
        if (!skill) return false;
        if (skill.optional) return true;
        if (skill.prereqs.length === 0) return true;
        return skill.prereqs.every(prereqId => this.getCrownLevel(prereqId) >= 1);
    },
    
    recordLessonComplete(skillId, perfect) {
        const progress = this.getProgress();
        if (!progress[skillId]) {
            progress[skillId] = { crown: 0, lessonsInCrown: 0, totalLessons: 0, perfectLessons: 0 };
        }
        
        progress[skillId].totalLessons++;
        if (perfect) progress[skillId].perfectLessons++;
        progress[skillId].lessonsInCrown++;
        
        if (progress[skillId].lessonsInCrown >= this.getLessonsPerCrown() && progress[skillId].crown < 5) {
            progress[skillId].crown++;
            progress[skillId].lessonsInCrown = 0;
        }
        
        this.saveProgress(progress);
        return progress[skillId];
    },
    
    getSkillsWithStatus() {
        return SKILL_TREE.map(skill => ({
            ...skill,
            crown: this.getCrownLevel(skill.id),
            lessonsInCrown: this.getLessonsCompleted(skill.id),
            unlocked: this.isUnlocked(skill.id),
            locked: !this.isUnlocked(skill.id)
        }));
    }
};

</script>

<script>
// [SHIELD_DAEMON: VALIDATED]
// Roleplay Engine - Phase 7 (Arcade Chat Refactor)
// Now works as an open-ended AI chatbot inside the Arcade overlay.
const RoleplayEngine = {
    RANDOM_TOPICS: [
        'Zombie apocalypse in Belgrade', 'Ordering pizza at 3am', 'Lost in the mountains',
        'A day at the beach', 'Job interview at a tech company', 'Buying a car',
        'At the dentist', 'Planning a birthday party', 'Cooking traditional Serbian food',
        'Asking for directions in a new city', 'Meeting your partner\'s parents',
        'Arguing about football', 'At the veterinarian with your pet', 'Renting an apartment',
        'Complaining at a restaurant', 'At the gym asking for help', 'Haggling at a market',
        'Stuck in traffic', 'Booking a hotel room', 'At the pharmacy buying medicine',
        'Describing your dream house', 'Talking about your favorite movie',
        'Making plans for the weekend', 'Reporting a problem to your landlord',
        'At the airport going through customs', 'Returning a broken product to a store',
        'Asking a stranger for the time', 'Talking about the weather', 'At a music festival',
        'Visiting a museum', 'At a wedding reception', 'Emergency room visit',
        'Enrolling in a language school', 'Talking to a police officer', 'At the post office',
        'Calling tech support', 'First day at a new job', 'Debating politics at dinner',
        'Explaining your hobby to someone', 'Catching up with an old school friend',
        'Negotiating a salary raise', 'Describing a painting', 'At a book club meeting',
        'Planning a road trip', 'Talking about childhood memories', 'At the barbershop',
        'Helping a tourist find their way', 'Discussing your favorite recipe',
        'Preparing for an exam', 'Adopting a pet from a shelter'
    ],

    state: {
        activeTopic: null,
        activeGreeting: null,
        history: [],
        isLoading: false,
        aiLang: 'Serbian',
        userLang: 'Serbian',
        nativeLang: 'English',
        aiTtsLang: 'sr-RS',
        role: ''
    },

    _getLangConfig: function() {
        const dir = (window.appState && window.appState.settings && window.appState.settings.learningDirection) || 'sr_to_en';
        const isLearningEnglish = (dir === 'sr_to_en');
        return {
            aiLang: isLearningEnglish ? 'English' : 'Serbian',
            userLang: isLearningEnglish ? 'English' : 'Serbian',
            nativeLang: isLearningEnglish ? 'Serbian' : 'English',
            aiTtsLang: isLearningEnglish ? 'en-US' : 'sr-RS'
        };
    },

    getEffectiveKey: function() {
        let ttsKey = '';
        if (window.appState && window.appState.settings) {
            ttsKey = window.appState.settings.ttsApiKey;
        }
        return ttsKey || window.apiKey || localStorage.getItem('serbolingo_api_key');
    },

    // Start with a specific topic string (e.g. "Ordering coffee at a cafe")
    startScenario: function(topicStr) {
        if (!this.getEffectiveKey()) {
            if (window.app && window.app.showToast) {
                window.app.showToast("Please enter an API Key in the Profile tab first.", "error");
                window.app.navigate('profile');
            }
            return;
        }

        const lang = this._getLangConfig();
        Object.assign(this.state, lang);
        this.state.activeTopic = topicStr;
        this.state.role = `You are role-playing the scenario: "${topicStr}". Act as a realistic character in this situation.`;
        this.state.history = [];

        const greeting = lang.aiLang === 'English'
            ? `Hello! Let's practice the scenario: "${topicStr}". I'll start. How can I help you?`
            : `Zdravo! Hajde da vežbamo situaciju: "${topicStr}". Ja počinjem. Kako mogu da vam pomognem?`;

        this.state.activeGreeting = greeting;
        this.state.history.push({ role: 'model', text: greeting });

        this._showOverlay(`🎭 ${topicStr}`);
        this.renderChat();

        if (window.app && window.app.speakPhrase) {
            setTimeout(() => window.app.speakPhrase(greeting, lang.aiTtsLang), 500);
        }
    },

    // Free chat - no scenario, just talk
    startFreeChat: function() {
        if (!this.getEffectiveKey()) {
            if (window.app && window.app.showToast) {
                window.app.showToast("Please enter an API Key in the Profile tab first.", "error");
                window.app.navigate('profile');
            }
            return;
        }

        const lang = this._getLangConfig();
        Object.assign(this.state, lang);
        this.state.activeTopic = '__free_chat__';
        this.state.role = `You are a friendly conversational partner. Talk naturally about anything the user brings up.`;
        this.state.history = [];

        const greeting = lang.aiLang === 'English'
            ? `Hey there! I'm your language buddy. Talk to me about anything you want – I'm all ears! 😊`
            : `Ćao! Ja sam tvoj jezički prijatelj. Pričaj sa mnom o čemu god želiš – slušam te! 😊`;

        this.state.activeGreeting = greeting;
        this.state.history.push({ role: 'model', text: greeting });

        this._showOverlay('🗣️ Free Chat');
        this.renderChat();

        if (window.app && window.app.speakPhrase) {
            setTimeout(() => window.app.speakPhrase(greeting, lang.aiTtsLang), 500);
        }
    },

    // Random topic
    startRandom: function() {
        const topic = this.RANDOM_TOPICS[Math.floor(Math.random() * this.RANDOM_TOPICS.length)];
        this.startScenario(topic);
    },

    // Close the chat overlay and go back to the arcade grid
    quitChat: function() {
        this.state.history = [];
        this.state.activeTopic = null;
        this.state.isLoading = false;
        const overlay = document.getElementById('arcade-chat-overlay');
        if (overlay) overlay.classList.add('hidden');
    },

    _showOverlay: function(title) {
        const overlay = document.getElementById('arcade-chat-overlay');
        if (overlay) overlay.classList.remove('hidden');

        const titleEl = document.getElementById('arcade-chat-title');
        if (titleEl) titleEl.textContent = title;

        const input = document.getElementById('arcade-chat-input');
        if (input) {
            input.value = '';
            input.placeholder = this.state.aiLang === 'English' ? 'Type in English...' : 'Kucaj na srpskom...';
            setTimeout(() => input.focus(), 300);
        }
    },

    sendMessage: async function(text) {
        if (!text || !text.trim() || this.state.isLoading) return;

        const apiKey = this.getEffectiveKey();
        if (!apiKey) {
            if (window.app && window.app.showToast) {
                window.app.showToast("Please enter an API Key in the Profile tab first.", "error");
                window.app.navigate('profile');
            }
            return;
        }

        this.state.history.push({ role: 'user', text: text.trim() });
        this.state.isLoading = true;
        this.renderChat();

        try {
            const contents = this.state.history.map(msg => ({
                role: msg.role === 'model' ? 'model' : 'user',
                parts: [{ text: msg.text }]
            }));

            const systemInstruction = `You are a native ${this.state.aiLang} speaker. ${this.state.role}
The user is a beginner learning ${this.state.aiLang}. 
Rules:
1. Speak ONLY in ${this.state.aiLang}.
2. Keep your responses short and natural (1-3 sentences max).
3. If the user makes a grammatical error or uses the wrong word, you MUST start your response with a ${this.state.nativeLang} correction in brackets like this: [Correction: In ${this.state.aiLang}, you should say X instead of Y]. Then continue your response in ${this.state.aiLang}. If there is no error, do not include brackets.`;

            const payload = {
                system_instruction: { parts: [{ text: systemInstruction }] },
                contents: contents,
                generationConfig: { temperature: 0.7 }
            };

            let response = null;
            let success = false;
            const models = ['gemini-2.5-flash', 'gemini-2.5-pro', 'gemini-2.0-flash', 'gemini-1.5-flash'];

            for (const model of models) {
                try {
                    response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) { success = true; break; }
                } catch(e) { /* Try next model */ }
            }

            if (!success || !response) throw new Error('Could not connect to any model');

            const data = await response.json();
            let aiResponse = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';

            let correction = null;
            const correctionMatch = aiResponse.match(/\[Correction:(.*?)\]/i);
            if (correctionMatch) {
                correction = correctionMatch[1].trim();
                aiResponse = aiResponse.replace(/\[Correction:.*?\]/i, '').trim();
            }

            this.state.history.push({ role: 'model', text: aiResponse, correction: correction });
            this.state.isLoading = false;
            this.renderChat();

            if (window.app && window.app.speakPhrase && aiResponse) {
                window.app.speakPhrase(aiResponse, this.state.aiTtsLang);
            }

        } catch (error) {
            console.error('Chat API Error:', error);
            this.state.isLoading = false;
            if (window.app) window.app.showToast('Greška u konekciji. (Network Error)', 'error');
            this.state.history.pop();
            this.renderChat();
        }
    },

    renderChat: function() {
        const container = document.getElementById('arcade-chat-history');
        if (!container) return;

        const aiTtsLang = this.state.aiTtsLang || 'sr-RS';
        let html = '';

        this.state.history.forEach(msg => {
            if (msg.role === 'model') {
                const safeText = msg.text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                html += `
                    <div class="flex flex-col items-start max-w-[85%] self-start mb-4">
                        ${msg.correction ? `<div class="bg-yellow-100 dark:bg-yellow-900/40 text-yellow-800 dark:text-yellow-200 text-[10px] font-bold px-3 py-1.5 rounded-t-xl rounded-br-xl mb-1 border border-yellow-200 dark:border-yellow-700/50 flex items-center gap-1"><span class="text-xs">💡</span> ${msg.correction}</div>` : ''}
                        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 p-3 rounded-2xl rounded-tl-sm shadow-sm relative group">
                            <span class="text-[15px] font-medium leading-snug">${msg.text}</span>
                            <button onclick="app.speakPhrase('${safeText}', '${aiTtsLang}')" class="absolute -right-10 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 rounded-full text-slate-500 hover:text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity">🔊</button>
                        </div>
                    </div>`;
            } else {
                html += `
                    <div class="flex flex-col items-end max-w-[85%] self-end mb-4">
                        <div class="bg-blue-500 text-white p-3 rounded-2xl rounded-tr-sm shadow-md">
                            <span class="text-[15px] font-medium leading-snug">${msg.text}</span>
                        </div>
                    </div>`;
            }
        });

        if (this.state.isLoading) {
            html += `
                <div class="flex flex-col items-start max-w-[85%] self-start mb-4">
                    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-400 p-4 rounded-2xl rounded-tl-sm shadow-sm flex gap-1">
                        <div class="w-2 h-2 bg-slate-300 dark:bg-slate-600 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
                        <div class="w-2 h-2 bg-slate-300 dark:bg-slate-600 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
                        <div class="w-2 h-2 bg-slate-300 dark:bg-slate-600 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
                    </div>
                </div>`;
        }

        container.innerHTML = html;

        setTimeout(() => {
            const wrapper = document.getElementById('arcade-chat-wrapper');
            if (wrapper) wrapper.scrollTop = wrapper.scrollHeight;
        }, 50);

        const input = document.getElementById('arcade-chat-input');
        if (input && !this.state.isLoading) {
            input.value = '';
            input.focus();
        }
    },

    handleInputKeypress: function(e) {
        if (e.key === 'Enter') {
            const input = document.getElementById('arcade-chat-input');
            if (input) this.sendMessage(input.value);
        }
    }
};

<script>
// [SHIELD_DAEMON: VALIDATED]
const ArcadeEngine = {
    _timers: [],
    
    _getWords: function(count) {
        const dir = (window.appState?.settings?.learningDirection) || 'sr_to_en';
        const script = (window.appState?.settings?.script) || 'latin';
        const srKey = script === 'cyrillic' ? 'sr_cyr' : 'sr_lat';
        const pool = (typeof DICTIONARY !== 'undefined' ? DICTIONARY : (window.appDb?.getAllWords ? window.appDb.getAllWords() : [])).slice();
        
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        
        const words = pool.slice(0, Math.min(count, pool.length));
        return words.map(w => ({
            source: dir === 'sr_to_en' ? w[srKey] : w.en,
            target: dir === 'sr_to_en' ? w.en : w[srKey],
            emoji: w.emoji || '',
            original: w
        }));
    },

    _showOverlay: function() {
        const overlay = document.getElementById('arcade-game-overlay');
        if (overlay) overlay.classList.remove('hidden');
    },

    _hideOverlay: function() {
        const overlay = document.getElementById('arcade-game-overlay');
        if (overlay) {
            overlay.innerHTML = '';
            overlay.classList.add('hidden');
        }
        this._cleanup();
    },

    _cleanup: function() {
        this._timers.forEach(t => {
            clearTimeout(t);
            clearInterval(t);
        });
        this._timers = [];
        
        if (this._reqAnim) {
            cancelAnimationFrame(this._reqAnim);
            this._reqAnim = null;
        }
    },

    _awardXpBoost: function() {
        if (window.appState && window.appState.inventory) {
            window.appState.inventory.xpBoosts = (window.appState.inventory.xpBoosts || 0) + 1;
            if (window.app && window.app.saveStats) window.app.saveStats();
            if (window.app && window.app.showToast) window.app.showToast('XP Boost Awarded!', 'success');
        }
    },

    _renderHeader: function(title, level, maxLevel, lives, score) {
        let livesHtml = '';
        if (lives !== null) {
            livesHtml = `<div>Lives: ${'❤️'.repeat(lives)}</div>`;
        }
        let scoreHtml = score !== null ? `<div>Score: ${score}</div>` : '';
        let levelHtml = level !== null ? `<div>Level: ${level}${maxLevel ? '/' + maxLevel : ''}</div>` : '';
        
        return `
            <div class="flex justify-between items-center p-4 bg-gray-800 text-white w-full">
                <div class="font-bold">${title}</div>
                <div class="flex space-x-4 text-sm">
                    ${levelHtml}
                    ${livesHtml}
                    ${scoreHtml}
                </div>
                <button onclick="ArcadeEngine._hideOverlay()" class="text-2xl font-bold">&times;</button>
            </div>
        `;
    },

    _renderGameOver: function(title, score, playAgainFnName) {
        return `
            <div class="flex flex-col items-center justify-center h-full w-full bg-gray-900 text-white p-6 text-center">
                <h2 class="text-4xl font-bold mb-4">Game Over</h2>
                <h3 class="text-2xl mb-8">${title}</h3>
                <p class="text-xl mb-8">Final Score: ${score}</p>
                <button onclick="ArcadeEngine.${playAgainFnName}()" class="px-6 py-3 bg-blue-600 rounded-lg text-xl mb-4 font-bold">Play Again</button>
                <button onclick="ArcadeEngine._hideOverlay()" class="px-6 py-3 bg-gray-600 rounded-lg text-xl font-bold">Back to Arcade</button>
            </div>
        `;
    },

    _renderLevelComplete: function(level, nextFnStr) {
        return `
            <div class="flex flex-col items-center justify-center h-full w-full bg-gray-900 text-white p-6 text-center">
                <h2 class="text-4xl font-bold mb-4 text-green-400">Level ${level} Complete!</h2>
                <button onclick="${nextFnStr}" class="px-6 py-3 bg-green-600 rounded-lg text-xl font-bold mt-8">Next Level</button>
            </div>
        `;
    },

    _playSound: function(type) {
        if (window.app && window.app.playSound) window.app.playSound(type);
    },

    _speak: function(text) {
        const lang = (window.appState?.settings?.learningDirection === 'sr_to_en') ? 'en-US' : 'sr-RS';
        if (window.app && window.app.speakPhrase) window.app.speakPhrase(text, lang);
    },

    startBotOpponent: function(containerId) {
        const container = document.getElementById(containerId);
        if(!container) return;
        
        let progress = 0;
        container.innerHTML = `
            <div class="w-full bg-gray-700 rounded h-4 mt-2">
                <div id="bot-progress" class="bg-red-500 h-4 rounded" style="width: 0%"></div>
            </div>
            <div class="text-xs text-center text-gray-400 mt-1">Marko_Bot</div>

        const bar = document.getElementById('bot-progress');

    // 1. Millionaire
    startMillionaire: function() {
        this._cleanup();
        this._showOverlay();
        const overlay = document.getElementById('arcade-game-overlay');
        
        let currentQuestion = 1;
        const totalQuestions = 15;
        let words = this._getWords(totalQuestions + 10);
        let usedFiftyFifty = false;
        
        const renderQuestion = () => {
            if (currentQuestion > totalQuestions) {
                this._awardXpBoost();
                overlay.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full bg-gray-900 text-white p-6 text-center">
                        <h2 class="text-4xl font-bold text-yellow-400 mb-4">YOU ARE A MILLIONAIRE!</h2>
                        <p class="text-xl mb-8">XP Boost Awarded!</p>
                        <button onclick="ArcadeEngine._hideOverlay()" class="px-6 py-3 bg-blue-600 rounded-lg text-xl font-bold">Awesome</button>
                    </div>
                `;
                return;
            }
            
            const targetWord = words[currentQuestion - 1];
            let options = this._getWords(4).filter(w => w.target !== targetWord.target).slice(0, 3);
            options.push(targetWord);
            options.sort(() => Math.random() - 0.5);
            
            window.millionaireAnswer = (idx) => {
                if (options[idx].target === targetWord.target) {
                    this._playSound('correct');
                    currentQuestion++;
                    renderQuestion();
                } else {
                    this._playSound('incorrect');
                    overlay.innerHTML = this._renderGameOver('Who Wants to Be a Millionaire', currentQuestion - 1, 'startMillionaire');
                }
            };
            
            window.millionaireFiftyFifty = () => {
                if (usedFiftyFifty) return;
                usedFiftyFifty = true;
                let removed = 0;
                options.forEach((opt, idx) => {
                    if (opt.target !== targetWord.target && removed < 2) {
                        document.getElementById('mil-opt-' + idx).style.visibility = 'hidden';
                        removed++;
                    }
                });
                document.getElementById('mil-btn-5050').classList.add('opacity-50', 'pointer-events-none');
            };
            
            overlay.innerHTML = `
                <div class="flex flex-col h-full bg-blue-900 text-white">
                    ${this._renderHeader('Millionaire', currentQuestion, totalQuestions, null, null)}

                        <div class="flex space-x-4 mb-8">
                            <button id="mil-btn-5050" onclick="millionaireFiftyFifty()" class="px-4 py-2 bg-yellow-600 rounded-full font-bold ${usedFiftyFifty ? 'opacity-50' : ''}">50:50</button>
                        </div>
                        <div class="bg-blue-800 p-6 rounded-xl w-full text-center text-2xl font-bold mb-8 border-2 border-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.5)]">
                            What is the translation of<br/>"${targetWord.source}" ${targetWord.emoji}?
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl">
                            ${options.map((opt, i) => `
                                <button id="mil-opt-${i}" onclick="millionaireAnswer(${i})" class="bg-blue-700 hover:bg-blue-600 border border-yellow-500 rounded-full py-4 text-xl font-bold text-left px-6">
                                    <span class="text-yellow-500 mr-2">${String.fromCharCode(65+i)}:</span> ${opt.target}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        };
        
        renderQuestion();
    },

    // 2. Match Pairs
    startMatchPairs: function() {
        this._cleanup();
        this._showOverlay();
        const overlay = document.getElementById('arcade-game-overlay');
        
        let level = 1;
        const maxLevel = 10;
        
        window.matchPairsNext = () => {
            if (level > maxLevel) {
                this._awardXpBoost();
                overlay.innerHTML = this._renderGameOver('Match Pairs', 'Won!', 'startMatchPairs');
                return;
            }
            
            const pairCount = Math.min(4 + Math.floor(level / 2), 8);
            const distractorCount = Math.floor(level / 2);
            let words = this._getWords(pairCount + distractorCount);
            let pairs = words.slice(0, pairCount);
            
            let sourceItems = pairs.map(p => ({ id: p.source, text: p.source, type: 'source' }));
            let targetItems = pairs.map(p => ({ id: p.source, text: p.target, type: 'target' }));
            
            sourceItems.sort(() => Math.random() - 0.5);
            targetItems.sort(() => Math.random() - 0.5);
            
            let selectedSource = null;
            let selectedTarget = null;
            let matched = 0;
            
            window.matchSelect = (type, idx, id) => {
                const el = document.getElementById(`mp-${type}-${idx}`);
                if (el.classList.contains('invisible')) return;
                
                if (type === 'source') {
                    if (selectedSource) document.getElementById(`mp-source-${selectedSource.idx}`).classList.remove('bg-blue-500');
                    selectedSource = {idx, id};
                    el.classList.add('bg-blue-500');
                } else {
                    if (selectedTarget) document.getElementById(`mp-target-${selectedTarget.idx}`).classList.remove('bg-blue-500');
                    selectedTarget = {idx, id};
                    el.classList.add('bg-blue-500');
                }
                
                if (selectedSource && selectedTarget) {
                    if (selectedSource.id === selectedTarget.id) {
                        this._playSound('correct');
                        document.getElementById(`mp-source-${selectedSource.idx}`).classList.add('invisible');
                        document.getElementById(`mp-target-${selectedTarget.idx}`).classList.add('invisible');
                        matched++;
                        selectedSource = null;
                        selectedTarget = null;
                        if (matched === pairCount) {
                            level++;
                            overlay.innerHTML = this._renderLevelComplete(level - 1, 'matchPairsNext()');
                        }
                    } else {
                        this._playSound('incorrect');
                        document.getElementById(`mp-source-${selectedSource.idx}`).classList.remove('bg-blue-500');
                        document.getElementById(`mp-target-${selectedTarget.idx}`).classList.remove('bg-blue-500');
                        document.getElementById(`mp-source-${selectedSource.idx}`).classList.add('bg-red-500');
                        document.getElementById(`mp-target-${selectedTarget.idx}`).classList.add('bg-red-500');
                        setTimeout(() => {
                            const sEl = document.getElementById(`mp-source-${selectedSource?.idx}`);
                            const tEl = document.getElementById(`mp-target-${selectedTarget?.idx}`);
                            if(sEl) sEl.classList.remove('bg-red-500');
                            if(tEl) tEl.classList.remove('bg-red-500');
                            selectedSource = null;
                            selectedTarget = null;
                        }, 500);
                    }
                }
            };
            
            overlay.innerHTML = `
                <div class="flex flex-col h-full bg-gray-900 text-white">
                    ${this._renderHeader('Match Pairs', level, maxLevel, null, null)}
                    <div class="flex-grow flex p-4 justify-center gap-4 max-w-lg mx-auto w-full">
                        <div class="flex flex-col gap-2 w-1/2">
                            ${sourceItems.map((item, i) => `
                                <div id="mp-source-${i}" onclick="matchSelect('source', ${i}, '${item.id}')" class="p-4 bg-gray-700 rounded-lg text-center font-bold cursor-pointer transition-colors select-none text-sm sm:text-base break-words flex items-center justify-center min-h-[60px]">${item.text}</div>
                            `).join('')}
                        </div>
                        <div class="flex flex-col gap-2 w-1/2">
                            ${targetItems.map((item, i) => `
                                <div id="mp-target-${i}" onclick="matchSelect('target', ${i}, '${item.id}')" class="p-4 bg-gray-700 rounded-lg text-center font-bold cursor-pointer transition-colors select-none text-sm sm:text-base break-words flex items-center justify-center min-h-[60px]">${item.text}</div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        };
        matchPairsNext();
    },

    // 3. Speed Typer
    startSpeedTyper: function() {
        this._cleanup();
        this._showOverlay();
        const overlay = document.getElementById('arcade-game-overlay');
        
        let level = 1;
        let lives = 3;
        let score = 0;
        let wordsMatched = 0;
        let activeWords = [];
        let spawnIntervalId = null;
        
        const nextLevel = () => {
            if (level >= 10) {
                this._awardXpBoost();
                overlay.innerHTML = this._renderGameOver('Speed Typer', score, 'startSpeedTyper');
                return;
            }
            level++;
            startLevel();
        };
        
        const startLevel = () => {
            activeWords = [];
            wordsMatched = 0;
            const wordsToMatch = 5 + level * 2;
            const wordsPool = this._getWords(50);
            const fallDuration = Math.max(1.5, 4 - (level * 0.25));
            const spawnRate = Math.max(800, 2500 - (level * 150));
            
            if (!document.getElementById('style-speedtyper')) {
                const style = document.createElement('style');
                style.id = 'style-speedtyper';
                style.innerHTML = `
                    @keyframes fallDown {
                        from { top: 0px; }
                        to { top: 100%; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            overlay.innerHTML = `
                <div class="flex flex-col h-full bg-gray-900 text-white relative overflow-hidden" id="speed-typer-container">
                    ${this._renderHeader('Speed Typer', level, 10, lives, score)}
                    <div id="game-area" class="flex-grow relative w-full h-full"></div>
                    <div class="p-4 bg-gray-800 z-10 relative">
                        <input type="text" id="typer-input" class="w-full p-4 rounded text-black font-bold text-xl" placeholder="Type translation here..." autocomplete="off">
                    </div>
                </div>
            `;
            
            const input = document.getElementById('typer-input');
            const gameArea = document.getElementById('game-area');
            if (input) input.focus();
            
            input.addEventListener('input', (e) => {
                const val = e.target.value.trim().toLowerCase();
                const matchedIdx = activeWords.findIndex(w => w.target.toLowerCase() === val && !w.matched);
                if (matchedIdx !== -1) {
                    const w = activeWords[matchedIdx];
                    w.matched = true;
                    w.el.remove();
                    e.target.value = '';
                    score += 10;
                    wordsMatched++;
                    this._playSound('correct');
                    updateHeader();
                    if (wordsMatched >= wordsToMatch) {
                        clearInterval(spawnIntervalId);
                        overlay.innerHTML = this._renderLevelComplete(level, 'ArcadeEngine.startSpeedTyper_next()');
                    }
                }
            });
            
            window.ArcadeEngine.startSpeedTyper_next = nextLevel;
            
            const spawnWord = () => {
                if (wordsMatched >= wordsToMatch) return;
                const w = wordsPool[Math.floor(Math.random() * wordsPool.length)];
                const el = document.createElement('div');
                el.className = 'absolute bg-blue-600 px-4 py-2 rounded shadow font-bold';
                el.textContent = w.source;
                el.style.left = Math.max(5, Math.random() * 70) + '%';
                el.style.animation = `fallDown ${fallDuration}s linear forwards`;
                
                const wordObj = { ...w, el, matched: false };
                activeWords.push(wordObj);
                gameArea.appendChild(el);
                
                el.addEventListener('animationend', () => {
                    if (!wordObj.matched) {
                        lives--;
                        this._playSound('incorrect');
                        el.remove();
                        updateHeader();
                        if (lives <= 0) {
                            clearInterval(spawnIntervalId);
                            overlay.innerHTML = this._renderGameOver('Speed Typer', score, 'startSpeedTyper');
                        }
                    }
                });
            };
            
            spawnIntervalId = setInterval(spawnWord, spawnRate);
            this._timers.push(spawnIntervalId);
        };
        
        const updateHeader = () => {
            const container = document.getElementById('speed-typer-container');
            if (container && container.firstElementChild) {
                container.firstElementChild.outerHTML = this._renderHeader('Speed Typer', level, 10, lives, score);
            }
        };
        
        startLevel();
    },

    // 4. Whack A Word
    startWhackAWord: function() {
        this._cleanup();
        this._showOverlay();
        const overlay = document.getElementById('arcade-game-overlay');
        
        let level = 1;
        let lives = 3;
        let score = 0;
        let currentTarget = null;
        let whackInterval = null;
        
        window.whackNextLevel = () => {
            if (level > 10) {
                this._awardXpBoost();
                overlay.innerHTML = this._renderGameOver('Whack A Word', score, 'startWhackAWord');
                return;
            }
            startLevel();
        };
        
        const startLevel = () => {
            const words = this._getWords(20);
            currentTarget = words[Math.floor(Math.random() * words.length)];
            const flashDuration = Math.max(600, 1500 - (level * 90));
            let targetsHit = 0;
            const targetsNeeded = 5 + level;
            
            overlay.innerHTML = `
                <div class="flex flex-col h-full bg-green-900 text-white" id="whack-container">
                    ${this._renderHeader('Whack a Word', level, 10, lives, score)}
                    <div class="text-center p-4 bg-green-800 text-2xl font-bold">Target: ${currentTarget.source}</div>
                    <div class="flex-grow flex items-center justify-center p-4">
                        <div class="grid grid-cols-3 gap-2 w-full max-w-sm aspect-square" id="whack-grid">
                            ${Array(9).fill(0).map((_, i) => `<div id="whack-cell-${i}" class="bg-green-700 rounded-lg flex items-center justify-center text-center p-2 font-bold break-words cursor-pointer active:bg-green-600 overflow-hidden text-sm sm:text-base"></div>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            window.whackTap = (idx, isTarget) => {
                const cell = document.getElementById(`whack-cell-${idx}`);
                if (!cell.textContent) return;
                
                if (isTarget) {
                    this._playSound('correct');
                    score += 10;
                    targetsHit++;
                    cell.textContent = '';
                    cell.onclick = null;
                    cell.classList.replace('bg-blue-500', 'bg-green-700');
                    if (targetsHit >= targetsNeeded) {
                        clearInterval(whackInterval);
                        level++;
                        overlay.innerHTML = this._renderLevelComplete(level - 1, 'whackNextLevel()');
                    } else {
                        currentTarget = words[Math.floor(Math.random() * words.length)];
                        const tc = document.querySelector('#whack-container .text-center.p-4');
                        if (tc) tc.textContent = 'Target: ' + currentTarget.source;
                        updateHeader();
                    }
                } else {
                    this._playSound('incorrect');
                    lives--;
                    updateHeader();
                    if (lives <= 0) {
                        clearInterval(whackInterval);
                        overlay.innerHTML = this._renderGameOver('Whack A Word', score, 'startWhackAWord');
                    }
                }
            };
            
            const updateHeader = () => {
                const container = document.getElementById('whack-container');
                if (container && container.firstElementChild) {
                    container.firstElementChild.outerHTML = this._renderHeader('Whack a Word', level, 10, lives, score);
                }
            };
            
            const tick = () => {
                for(let i=0; i<9; i++) {
                    const c = document.getElementById(`whack-cell-${i}`);
                    if(c) {
                        c.textContent = '';
                        c.onclick = null;
                        c.classList.remove('bg-blue-500', 'bg-red-500');
                        c.classList.add('bg-green-700');
                    }
                }
                
                let cells = [0,1,2,3,4,5,6,7,8].sort(() => Math.random() - 0.5).slice(0, 3 + Math.floor(level/3));
                let targetCell = cells[0];
                
                cells.forEach(idx => {
                    const c = document.getElementById(`whack-cell-${idx}`);
                    if (!c) return;
                    let isTarget = idx === targetCell;
                    let w = isTarget ? currentTarget : words[Math.floor(Math.random() * words.length)];
                    if(!isTarget && w.target === currentTarget.target) w = words.find(x => x.target !== currentTarget.target) || words[0];
                    
                    c.textContent = w.target;
                    c.classList.remove('bg-green-700');
                    c.classList.add(isTarget ? 'bg-blue-500' : 'bg-red-500');
                    c.onclick = () => whackTap(idx, isTarget);
                });
            };
            
            whackInterval = setInterval(tick, flashDuration);
            this._timers.push(whackInterval);
            tick();
        };
        
        startLevel();
    },

    // 5. Hangman
    startHangman: function() {
        this._cleanup();
        this._showOverlay();
        const overlay = document.getElementById('arcade-game-overlay');
        
        let level = 1;
        let words = this._getWords(20).sort((a,b) => a.target.length - b.target.length);
        
        window.hangmanNext = () => {
            if (level > 10 || level > words.length) {
                this._awardXpBoost();
                overlay.innerHTML = this._renderGameOver('Hangman', 'Won!', 'startHangman');
                return;
            }
            
            let targetWord = words[level-1];
            let answer = targetWord.target.toUpperCase();
            let guessed = new Set();
            let wrong = 0;
            const maxWrong = 6;
            
            const isCyr = (window.appState?.settings?.script === 'cyrillic');
            const letters = isCyr ? 'АБВГДЂЕЖЗИЈКЛЉМНЊОПРСТЋУФХЦЧЏШ'.split('') : 'ABCDEFGHIJKLMNOPQRSTUVWXYZČĆŽŠĐ'.split('');
            
            const render = () => {
                let display = answer.split('').map(c => {
                    if(c === ' ') return '&nbsp;&nbsp;';
                    if(!c.match(/[A-ZČĆŽŠĐА-Ш]/i)) return c;
                    return guessed.has(c) ? c : '_';
                }).join(' ');
                
                let isWin = answer.split('').every(c => c === ' ' || !c.match(/[A-ZČĆŽŠĐА-Ш]/i) || guessed.has(c));
                
                if (isWin) {
                    this._playSound('correct');
                    level++;
                    overlay.innerHTML = this._renderLevelComplete(level - 1, 'hangmanNext()');
                    return;
                }
                if (wrong >= maxWrong) {
                    this._playSound('incorrect');
                    overlay.innerHTML = this._renderGameOver('Hangman', `Failed! Word was: ${answer}`, 'startHangman');
                    return;
                }
                
                window.hangmanGuess = (l) => {
                    if (guessed.has(l)) return;
                    guessed.add(l);
                    if (!answer.includes(l)) {
                        wrong++;
                    }
                    render();
                };
                
                overlay.innerHTML = `
                    <div class="flex flex-col h-full bg-gray-900 text-white">
                        ${this._renderHeader('Hangman', level, 10, null, null)}
                        <div class="flex-grow flex flex-col items-center justify-center p-4">
                            <div class="text-xl text-gray-400 mb-2">Translate:</div>
                            <div class="text-3xl font-bold mb-8 text-center text-blue-400">${targetWord.source}</div>
                            
                            <div class="w-32 h-32 border-2 border-gray-600 mb-8 flex items-center justify-center relative">
                                <div class="text-xs text-red-500 font-mono text-center">Parts drawn:<br/>${wrong}/${maxWrong}</div>
                            </div>
                            
                            <div class="text-4xl font-mono tracking-widest mb-12 text-center break-words w-full px-4">${display}</div>
                            
                            <div class="flex flex-wrap justify-center gap-2 max-w-2xl">
                                ${letters.map(l => `
                                    <button onclick="hangmanGuess('${l}')" class="w-10 h-10 rounded ${guessed.has(l) ? (answer.includes(l) ? 'bg-green-600' : 'bg-red-600 opacity-50') : 'bg-gray-700 hover:bg-gray-600'} font-bold">${l}</button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            };
            render();
        };
        hangmanNext();
    },

    // 6. Word Scramble
    startWordScramble: function() {
        this._cleanup();
        this._showOverlay();
        const overlay = document.getElementById('arcade-game-overlay');
        let level = 1;
        let words = this._getWords(20).filter(w => w.target.length > 3).sort((a,b) => a.target.length - b.target.length);
        let timerId = null;
        
        window.scrambleNext = () => {
            if (level > 10 || level > words.length) {
                this._awardXpBoost();
                overlay.innerHTML = this._renderGameOver('Word Scramble', 'Won!', 'startWordScramble');
                return;
            }
            
            let targetWord = words[level-1];
            let answer = targetWord.target.toUpperCase().replace(/\s+/g, '');
            let scrambled = answer.split('').sort(() => Math.random() - 0.5);
            let selected = [];
            let timeLeft = 15;
            
            const checkAnswer = () => {
                if (selected.length === answer.length) {
                    if (selected.join('') === answer) {
                        this._playSound('correct');
                        clearInterval(timerId);
                        level++;
                        overlay.innerHTML = this._renderLevelComplete(level - 1, 'scrambleNext()');
                    } else {
                        selected = [];
                        render();
                    }
                }
            };
            
            window.scrambleTap = (idx) => {
                selected.push(scrambled[idx]);
                scrambled.splice(idx, 1);
                render();
                checkAnswer();
            };
            
            window.scrambleUndo = () => {
                if(selected.length > 0) {
                    scrambled.push(selected.pop());
                    render();
                }
            };
            
            const render = () => {
                const headerHtml = this._renderHeader('Word Scramble', level, 10, null, null);
                overlay.innerHTML = `
                    <div class="flex flex-col h-full bg-purple-900 text-white relative">
                        ${headerHtml}
                        <div class="absolute top-16 right-4 text-2xl font-bold text-yellow-400" id="scramble-timer">${timeLeft}s</div>
                        <div class="flex-grow flex flex-col items-center justify-center p-4">
                            <div class="text-xl text-gray-300 mb-2">What is:</div>
